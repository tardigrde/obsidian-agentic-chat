# SonarCloud Automatic Analysis — exclude test/E2E harnesses from duplication.
# E2E specs share probe/emit/openChat boilerplate; unit test helpers are not production duplication.
# The slash-command registry is a declarative data table: every row has the same
# { name, args, description } shape, so CPD flags the rows as duplicate structure.
sonar.cpd.exclusions=test/e2e/**,test/**,**/*.e2e.ts,**/*.test.ts,src/ui/commands.ts
sonar.coverage.exclusions=test/e2e/**,test/**,**/*.e2e.ts,**/*.test.ts
sonar.test.inclusions=test/e2e/**/*,test/**/*
