name: Review report

permissions:
  contents: read
  issues: read
  pull-requests: read
  # The report reads the ci and e2e check runs when a verdict cites CI.
  checks: read

# Advisory (#393 T02, decisions D4/D7). The agent-review verdict is a PR
# comment the owner reads before writing "merge"; this job only reports whether
# a verdict exists at the head and how large the PR is. It never fails, and a
# comment no longer triggers a run (comment runs attached to main and could not
# update the PR check anyway).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # The PR head is the tree being measured (size and head SHA). Its own
      # scripts never run here.
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false

      # The report script comes from the trusted base, like the witness.
      - name: Check out the trusted report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Verdict and size report (advisory)
        # A base whose script still enforces must not turn the report red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_GATE_SINGLE_ACCOUNT: "1"
        working-directory: pr
        run: node ../trusted/scripts/check-review-gate.mjs
