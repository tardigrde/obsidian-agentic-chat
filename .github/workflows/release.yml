name: Release

# Release only a main commit that passed the full CI workflow (verify ci,
# e2e, mobile lane, scripted eval). The release job does not re-run a subset.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/release_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
        run: |
          # main is protected by a ruleset. The release deploy key is the only
          # bypass actor, so the version-bump commit can be pushed from CI.
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > ~/.ssh/release_deploy_key
          chmod 600 ~/.ssh/release_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          npx --yes \
            --ignore-scripts \
            --package semantic-release@25.0.5 \
            --package @semantic-release/exec@7.1.0 \
            --package @semantic-release/git@10.0.1 \
            --package conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
