name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts # NOSONAR:S6505 -- project install, not a global package install.

      - name: Fault and state-machine tests
        run: >
          npx vitest run
          test/memory-adapter-faults.test.ts
          test/semantic-index.test.ts
          test/semantic-index-lease.test.ts
          test/session-swap-queue.test.ts
          test/session-manager.test.ts
          test/session-invariants.test.ts
          test/session-actions.test.ts
          test/agent-service.test.ts

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts # NOSONAR:S6505 -- project install, not a global package install.

      - name: Mutation matrix
        run: npm run mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
