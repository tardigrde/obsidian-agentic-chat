name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # @earendil-works/pi-* require node >=22.19 (tested on 24).
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify (typecheck, lint, unit + coverage report, production build)
        run: npm run verify -- ci # NOSONAR:S6505 -- runs the project verify script, not a package install.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              .total |
              to_entries[] |
              select(.value.pct != null) |
              "| \(.key | ascii_upcase) | \(.value.pct)% |"
            ' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Production build
        run: npm run build

  # Full deterministic e2e suite in a real Obsidian under a virtual display.
  # Headless ozone lacks the accessibility tree `toHaveText` needs, so the job
  # uses Xvfb. The no-key smoke spec is part of this suite; live specs skip
  # without credentials. The scripted dogfood eval then runs in the same job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # @earendil-works/pi-* require node >=22.19 (tested on 24).
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libdrm2 libsecret-1-0 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64

      - name: Cache Obsidian runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: e2e-obsidian-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            e2e-obsidian-${{ runner.os }}-

      - name: Full e2e suite (xvfb)
        run: xvfb-run -a npm run verify -- e2e

      - name: Mobile two-tab lane (xvfb)
        run: xvfb-run -a npm run test:e2e:mobile -- --spec test/e2e/specs/multi-tab-approval.e2e.ts

      - name: Scripted dogfood eval (xvfb)
        run: xvfb-run -a npm run verify -- eval --run-scripted

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: |
            logs/e2e-artifacts/
            logs/eval-runs/
          retention-days: 14
