name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @earendil-works/pi-* require node >=22.19 (tested on 24).
          node-version: "24"
          cache: npm

      - name: Install dependencies
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == dependabot/* ]]; then
            npm install
          else
            npm ci
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint (Obsidian plugin rules)
        run: npm run lint:obsidian

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              .total |
              to_entries[] |
              select(.value.pct != null) |
              "| \(.key | ascii_upcase) | \(.value.pct)% |"
            ' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Production build
        run: npm run build

  # Catches e2e-only breakage (e.g. the mocha 11/12 split that stayed green in
  # `ci` for two weeks). Runs just the no-API-key smoke spec under a virtual
  # display — headless ozone lacks the accessibility tree `toHaveText` needs.
  smoke-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @earendil-works/pi-* require node >=22.19 (tested on 24).
          node-version: "24"
          cache: npm

      - name: Install dependencies
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == dependabot/* ]]; then
            npm install
          else
            npm ci
          fi

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libdrm2 libsecret-1-0 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64

      - name: Cache Obsidian runtime
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: e2e-obsidian-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            e2e-obsidian-${{ runner.os }}-

      - name: Smoke e2e (xvfb)
        run: xvfb-run -a npm run test:e2e -- --spec test/e2e/specs/smoke.e2e.ts

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: logs/e2e-artifacts/
          retention-days: 14
