# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # pi-ai + pi-agent-core must bump together: core nests its own pi-ai copy,
    # so lone-package PRs split the AssistantMessageEventStream class identity
    # and break typecheck (see #154/#156, both superseded by #158). Group them
    # into a single PR.
    groups:
      earendil-works:
        patterns:
          - "@earendil-works/*"
      # vitest + @vitest/* must bump together: coverage-v8 peers exact
      # vitest version, so lone-package PRs fail npm install with ERESOLVE
      # (see #163/#165, both red alone, green combined 5.0.1). Group them
      # into a single PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Batch low-risk patch-only updates to reduce PR/CI noise. Keep
      # minor/major separate for visibility (e.g. globals minor, vitest
      # major, typescript major).
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Workflow actions are pinned to commit SHAs (Sonar S8543). Keep those pins
  # current with one grouped weekly PR instead of leaving them to rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
