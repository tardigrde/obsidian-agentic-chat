# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Mocha 12 is incompatible with @wdio/mocha-framework 9.31.x (removed
    # mocha/lib/cli/run-helpers.js import; dual-copy describe crash). Hold the
    # major until upstream supports it. Remove when #162 is closed.
    # https://github.com/tardigrde/obsidian-agentic-chat/issues/162
    ignore:
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
